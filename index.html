<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task & Code Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #030305; color: #e2e8f0; padding: 40px; }
        .card { background: #0f0f19; border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; margin-bottom: 20px; max-width: 500px; }
        pre { background: #000; padding: 10px; border-radius: 8px; color: #38bdf8; margin: 10px 0; overflow-x: auto; }
        button { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>

    <div id="container"></div>

    <script>
        const items = [
            { title: "Đoạn mã JavaScript mẫu", code: "console.log('Xin chào!');" }
        ];

        function render() {
            const container = document.getElementById('container');
            container.innerHTML = "";
            
            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <h3>${item.title}</h3>
                    <pre><code>${item.code}</code></pre>
                `;

                const btn = document.createElement('button');
                btn.innerHTML = `<i class="fa-regular fa-clone"></i> Sao chép`;
                
                // Sử dụng sự kiện addEventListener thay vì onclick trực tiếp để tránh lỗi thoát ký tự
                btn.addEventListener('click', () => {
                    navigator.clipboard.writeText(item.code).then(() => {
                        btn.innerHTML = `<i class="fa-solid fa-check"></i> Đã chép!`;
                        setTimeout(() => {
                            btn.innerHTML = `<i class="fa-regular fa-clone"></i> Sao chép`;
                        }, 1500);
                    });
                });

                card.appendChild(btn);
                container.appendChild(card);
            });
        }

        render();
    </script>
</body>
</html>
