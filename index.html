<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baoh4cksupport - Cyber Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #050508;
            color: #f3e8ff;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(147, 51, 234, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.1) 0%, transparent 40%);
            padding-bottom: 60px;
        }

        /* Header sáng tạo */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(11, 9, 20, 0.7);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(192, 132, 252, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #c084fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(192, 132, 252, 0.4);
        }

        .search-box {
            position: relative;
            width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background: rgba(23, 16, 46, 0.6);
            border: 1px solid rgba(192, 132, 252, 0.3);
            border-radius: 30px;
            color: #fff;
            outline: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-box input:focus {
            border-color: #c084fc;
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.3);
            background: rgba(23, 16, 46, 0.9);
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #c084fc;
        }

        .admin-btn {
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }

        .admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.6);
        }

        /* Danh mục bộ lọc */
        .filters {
            display: flex;
            gap: 12px;
            padding: 30px 50px 20px 50px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .filter-btn {
            background: rgba(23, 16, 46, 0.5);
            color: #d8b4fe;
            border: 1px solid rgba(192, 132, 252, 0.2);
            padding: 10px 24px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .filter-btn.active, .filter-btn:hover {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
            border-color: #c084fc;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            transform: translateY(-2px);
        }

        /* Lưới hiển thị Card sáng tạo */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
            padding: 0 50px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: rgba(19, 15, 34, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(192, 132, 252, 0.2);
            border-radius: 20px;
            padding: 25px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            animation: fadeIn 0.6s ease-out forwards;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, #38bdf8, #c084fc, #f472b6);
            opacity: 0;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(192, 132, 252, 0.6);
            box-shadow: 0 15px 35px rgba(147, 51, 234, 0.2);
        }

        .card:hover::before {
            opacity: 1;
        }

        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            font-size: 11px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            letter-spacing: 0.5px;
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #fff;
        }

        .code-box {
            background: rgba(5, 5, 8, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 13px;
            color: #38bdf8;
            white-space: nowrap;
            overflow-x: auto;
            margin-bottom: 20px;
        }

        .code-box::-webkit-scrollbar { height: 4px; }
        .code-box::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 2px; }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
            font-size: 13px;
            color: #94a3b8;
        }

        .btn-copy {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 15px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-copy:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
            background: linear-gradient(135deg, #2563eb, #1e40af);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 8, 0.85);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: #130f22;
            border: 1px solid rgba(192, 132, 252, 0.4);
            padding: 35px;
            border-radius: 24px;
            width: 420px;
            max-width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            animation: zoomIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content h3 { margin-bottom: 20px; color: #c084fc; font-family: 'Orbitron', sans-serif; }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            background: rgba(5, 5, 8, 0.8);
            border: 1px solid rgba(192, 132, 252, 0.2);
            color: #fff;
            border-radius: 12px;
            outline: none;
        }
        .modal-content input:focus, .modal-content textarea:focus { border-color: #c084fc; }

        .modal-actions { display: flex; gap: 12px; }
        .modal-actions button { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-submit { background: #22c55e; color: white; }
        .btn-submit:hover { background: #16a34a; }
        .btn-close { background: #ef4444; color: white; }
        .btn-close:hover { background: #dc2626; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <i class="fa-solid fa-meteor"></i>
            <span>BAOH4CK-HUB</span>
        </div>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Tìm kiếm script thần tốc..." onkeyup="searchScripts()">
        </div>
        <div class="header-right">
            <button class="admin-btn" onclick="playClickSound(); checkAdmin();">
                <i class="fa-solid fa-shield-halved"></i> Admin Login
            </button>
        </div>
    </header>

    <div class="filters">
        <button class="filter-btn active" onclick="playClickSound(); filterCategory('Tất cả', this)">Tất cả</button>
        <button class="filter-btn" onclick="playClickSound(); filterCategory('ROBLOX', this)">Roblox</button>
        <button class="filter-btn" onclick="playClickSound(); filterCategory('TOOL', this)">Tool</button>
    </div>

    <div class="container" id="scriptContainer"></div>

    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h3>ĐĂNG SCRIPT MỚI</h3>
            <input type="text" id="scriptTitle" placeholder="Tên Script (VD: Blox Fruits Op)">
            <select id="scriptCategory">
                <option value="ROBLOX - BLOX FRUITS">ROBLOX - BLOX FRUITS</option>
                <option value="ROBLOX - KHÁC">ROBLOX - KHÁC</option>
                <option value="TOOL - HỆ THỐNG">TOOL - HỆ THỐNG</option>
            </select>
            <textarea id="scriptCode" placeholder="Dán mã Loadstring vào đây..." rows="3"></textarea>
            <div class="modal-actions">
                <button class="btn-submit" onclick="playClickSound(); addNewScript()">Đăng Bài</button>
                <button class="btn-close" onclick="playClickSound(); closeModal()">Hủy</button>
            </div>
        </div>
    </div>

    <script>
        // Mật khẩu đặc biệt thể hiện tình yêu của bạn
        const ADMIN_PASSWORD = "baoiuhvy168";

        // Tích hợp âm thanh tương tác (Web Audio API - Không cần file ngoài)
        function playClickSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nốt D5
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        let scripts = JSON.parse(localStorage.getItem('my_scripts_pro')) || [
            { title: "Evomon Ultimate Hub", category: "ROBLOX - BLOX FRUITS", code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/zenike/..."))()' }
        ];

        function renderScripts(data = scripts) {
            const container = document.getElementById('scriptContainer');
            container.innerHTML = "";
            data.forEach((item) => {
                container.innerHTML += `
                    <div class="card">
                        <div>
                            <span class="badge">${item.category}</span>
                            <div class="card-title">${item.title}</div>
                            <div class="code-box">${item.code}</div>
                        </div>
                        <div>
                            <div class="card-footer">
                                <span><i class="fa-regular fa-eye"></i> Tương tác mượt</span>
                                <span style="color: #c084fc; font-weight: 600;">Active</span>
                            </div>
                            <button class="btn-copy" onclick="playClickSound(); copyCode('${item.code}', this)">
                                <i class="fa-regular fa-copy"></i> Sao chép mã
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function checkAdmin() {
            let pass = prompt("Nhập mật khẩu quản trị (Bí mật tình yêu ❤️):");
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('adminModal').style.display = 'flex';
            } else if (pass !== null) {
                alert("Sai mật khẩu rồi bạn ơi!");
            }
        }

        function closeModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function addNewScript() {
            let title = document.getElementById('scriptTitle').value;
            let category = document.getElementById('scriptCategory').value;
            let code = document.getElementById('scriptCode').value;

            if(!title || !code) {
                alert("Vui lòng điền đủ thông tin!");
                return;
            }

            scripts.unshift({ title, category, code });
            localStorage.setItem('my_scripts_pro', JSON.stringify(scripts));
            renderScripts();
            closeModal();
            
            document.getElementById('scriptTitle').value = '';
            document.getElementById('scriptCode').value = '';
        }

        function copyCode(text, btn) {
            navigator.clipboard.writeText(text);
            let originalHTML = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-check"></i> Đã sao chép thành công!`;
            btn.style.background = "linear-gradient(135deg, #16a34a, #15803d)";
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.style.background = "linear-gradient(135deg, #3b82f6, #1d4ed8)";
            }, 1800);
        }

        function searchScripts() {
            let keyword = document.getElementById('searchInput').value.toLowerCase();
            let filtered = scripts.filter(s => s.title.toLowerCase().includes(keyword) || s.category.toLowerCase().includes(keyword));
            renderScripts(filtered);
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(cat === 'Tất cả') {
                renderScripts();
            } else {
                let filtered = scripts.filter(s => s.category.includes(cat));
                renderScripts(filtered);
            }
        }

        renderScripts();
    </script>
</body>
</html>
