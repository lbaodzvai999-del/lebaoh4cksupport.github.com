<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baoh4cksupport - Script Hub Pro</title>
    <!-- Sử dụng thư viện icon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0914;
            color: #f3e8ff;
            min-height: 100vh;
            padding-bottom: 50px;
        }
        /* Header & Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid #2e1065;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #c084fc;
        }
        .search-box {
            position: relative;
            width: 350px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            background: #17102e;
            border: 1px solid #3b0764;
            border-radius: 8px;
            color: #fff;
            outline: none;
            transition: 0.3s;
        }
        .search-box input:focus {
            border-color: #c084fc;
            box-shadow: 0 0 10px rgba(192, 132, 252, 0.2);
        }
        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }
        .header-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .admin-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .admin-btn:hover {
            background: #1d4ed8;
        }

        /* Filter Categories */
        .filters {
            display: flex;
            gap: 10px;
            padding: 20px 30px;
            max-width: 1400px;
            margin: 0 auto;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: #17102e;
            color: #d8b4fe;
            border: 1px solid #3b0764;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #3b0764;
            color: #fff;
            border-color: #c084fc;
        }

        /* Grid Cards */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
            padding: 0 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: #130f22;
            border: 1px solid #2e1065;
            border-radius: 12px;
            padding: 20px;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover {
            border-color: #c084fc;
            box-shadow: 0 5px 15px rgba(147, 51, 234, 0.15);
        }
        .badge {
            display: inline-block;
            background: #1e1b4b;
            color: #818cf8;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            border: 1px solid #312e81;
        }
        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #f8fafc;
        }
        .code-box {
            background: #090710;
            border: 1px solid #1e1b4b;
            padding: 10px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            color: #38bdf8;
            white-space: nowrap;
            overflow-x: auto;
            margin-bottom: 15px;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #1e1b4b;
            padding-top: 12px;
            font-size: 13px;
            color: #94a3b8;
        }
        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .btn-copy {
            flex: 1;
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-copy:hover {
            background: #1d4ed8;
        }

        /* Modal Đăng Bài (Admin Panel) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: #130f22;
            border: 1px solid #c084fc;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            max-width: 90%;
        }
        .modal-content h3 { margin-bottom: 15px; color: #c084fc; }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #090710;
            border: 1px solid #3b0764;
            color: #fff;
            border-radius: 6px;
            outline: none;
        }
        .modal-actions { display: flex; gap: 10px; }
        .modal-submit { background: #22c55e; color: white; }
        .btn-close { background: #ef4444; color: white; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-area">
            <i class="fa-solid fa-gamepad" style="color: #c084fc;"></i>
            <span>Baoh4cksupport Hub</span>
        </div>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Tìm kiếm script..." onkeyup="searchScripts()">
        </div>
        <div class="header-right">
            <button class="admin-btn" onclick="checkAdmin()"><i class="fa-solid fa-lock"></i> Admin Login</button>
        </div>
    </header>

    <!-- Categories Filters -->
    <div class="filters">
        <button class="filter-btn active" onclick="filterCategory('Tất cả', this)">Tất cả</button>
        <button class="filter-btn" onclick="filterCategory('ROBLOX', this)"><i class="fa-solid fa-gamepad"></i> Roblox</button>
        <button class="filter-btn" onclick="filterCategory('TOOL', this)"><i class="fa-solid fa-screwdriver-wrench"></i> Tool</button>
    </div>

    <!-- Cards Container -->
    <div class="container" id="scriptContainer">
        <!-- Script sẽ được render tự động ở đây -->
    </div>

    <!-- Modal Đăng Script -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h3>Thêm Script Mới (Admin)</h3>
            <input type="text" id="scriptTitle" placeholder="Tên Script (VD: Blox Fruits Hub)">
            <select id="scriptCategory">
                <option value="ROBLOX - BLOX FRUITS">ROBLOX - BLOX FRUITS</option>
                <option value="ROBLOX - KHÁC">ROBLOX - KHÁC</option>
                <option value="TOOL - PHẦN MỀM">TOOL - PHẦN MỀM</option>
            </select>
            <textarea id="scriptCode" placeholder="Dán mã Loadstring hoặc Link vào đây..." rows="3"></textarea>
            <div class="modal-actions">
                <button class="btn-submit" onclick="addNewScript()" style="background: #22c55e; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1;">Đăng Bài</button>
                <button class="btn-close" onclick="closeModal()" style="background: #ef4444; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1;">Đóng</button>
            </div>
        </div>
    </div>

    <script>
        // Mật khẩu Admin đã được đổi theo yêu cầu tình yêu của bạn
        const ADMIN_PASSWORD = "baoiuhvy168";

        let scripts = JSON.parse(localStorage.getItem('my_scripts')) || [
            { title: "Evomon Script", category: "ROBLOX - BLOX FRUITS", code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/zenike/..."))()' }
        ];

        function renderScripts(data = scripts) {
            const container = document.getElementById('scriptContainer');
            container.innerHTML = "";
            data.forEach((item) => {
                container.innerHTML += `
                    <div class="card">
                        <div>
                            <span class="badge">${item.category}</span>
                            <div class="card-title">${item.title}</div>
                            <div class="code-box">${item.code}</div>
                        </div>
                        <div>
                            <div class="card-footer">
                                <span><i class="fa-regular fa-eye"></i> Lượt xem: 1</span>
                                <span>Script Code</span>
                            </div>
                            <div class="card-actions">
                                <button class="btn-copy" onclick="copyCode('${item.code}', this)">Sao chép</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function checkAdmin() {
            let pass = prompt("Nhập mật khẩu quản trị (Admin):");
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('adminModal').style.display = 'flex';
            } else if (pass !== null) {
                alert("Sai mật khẩu! Bạn không có quyền đăng bài.");
            }
        }

        function closeModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function addNewScript() {
            let title = document.getElementById('scriptTitle').value;
            let category = document.getElementById('scriptCategory').value;
            let code = document.getElementById('scriptCode').value;

            if(!title || !code) {
                alert("Vui lòng điền đầy đủ tên và mã script!");
                return;
            }

            scripts.unshift({ title, category, code });
            localStorage.setItem('my_scripts', JSON.stringify(scripts));
            renderScripts();
            closeModal();
            
            document.getElementById('scriptTitle').value = '';
            document.getElementById('scriptCode').value = '';
        }

        function copyCode(text, btn) {
            navigator.clipboard.writeText(text);
            let oldText = btn.innerText;
            btn.innerText = "Đã chép! ✓";
            btn.style.background = "#16a34a";
            setTimeout(() => {
                btn.innerText = oldText;
                btn.style.background = "#2563eb";
            }, 1500);
        }

        function searchScripts() {
            let keyword = document.getElementById('searchInput').value.toLowerCase();
            let filtered = scripts.filter(s => s.title.toLowerCase().includes(keyword) || s.category.toLowerCase().includes(keyword));
            renderScripts(filtered);
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(cat === 'Tất cả') {
                renderScripts();
            } else {
                let filtered = scripts.filter(s => s.category.includes(cat));
                renderScripts(filtered);
            }
        }

        renderScripts();
    </script>
</body>
</html>
